# CUA multimodal profile using official deterministic operations.
# E17 and FM-17 are text-only reasoning disclosure requirements; V3 allows
# real no-reasoning trajectories. Coding-specific groups are excluded.
# FX-06/07/08 are excluded: this batch preserves all actual calls, texts and
# argument order. Applicable defects are filtered; mask proposals are recorded.
name: clean_cua_fixed
apply_ref_use_loss_seq: true
groups:
- name: common_format_fixes
  run_method: files_by_step
  ordering: by_phase
  operations:
  - operation: format_fix:FX-03
  - operation: format_fix:FX-04
  - operation: format_fix:FX-05
- name: common_format_filters
